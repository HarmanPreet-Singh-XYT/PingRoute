name: Build macOS

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build Configuration (Release or Debug)'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build-macos:
    name: Build macOS Application
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Application
        run: |
          if [ "${{ inputs.configuration }}" = "Debug" ]; then
            flutter build macos --debug
            APP_DIR="build/macos/Build/Products/Debug"
          else
            flutter build macos --release
            APP_DIR="build/macos/Build/Products/Release"
          fi

          # Zip the .app bundle for easy download
          cd "$APP_DIR"
          zip -r "$GITHUB_WORKSPACE/PingRoute-macOS.zip" PingRoute.app

      - name: Upload macOS Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PingRoute-macOS-App
          path: PingRoute-macOS.zip
          if-no-files-found: error
