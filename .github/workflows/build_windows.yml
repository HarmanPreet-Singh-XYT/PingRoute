name: Build Windows x64

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build Configuration (Release or Debug)'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Executable & MSIX Package
        shell: pwsh
        run: |
          .\build_windows.ps1 -Configuration ${{ inputs.configuration }} -Architecture x64 -Msix

      - name: Upload MSIX Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PingRoute-Windows-x64-MSIX
          path: build/windows/x64/runner/${{ inputs.configuration }}/PingRoute.msix
          if-no-files-found: error

      - name: Upload Executable Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PingRoute-Windows-x64-Executable
          path: build/windows/x64/runner/${{ inputs.configuration }}/
          if-no-files-found: warn
