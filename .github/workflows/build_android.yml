name: Build Android

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build Configuration (Release or Debug)'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build-android:
    name: Build Android (APK & App Bundle)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          if [ "${{ inputs.configuration }}" = "Debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Build Android App Bundle (Release only)
        if: inputs.configuration == 'Release'
        run: flutter build appbundle --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PingRoute-Android-APK
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Upload Android App Bundle Artifact (Release only)
        if: inputs.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: PingRoute-Android-AppBundle
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn
