name: pingroute
version: '1.0.0'
summary: Real-time network traceroute and ping diagnostic tool
description: |
  PingRoute is a network visualization and diagnostic tool providing real-time ping graphs, hop analysis, and multi-target traceroute inspection.

grade: stable
confinement: strict
base: core22

architectures:
  - build-on: amd64

apps:
  pingroute:
    command: pingroute
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - network-observe
      - network-control

parts:
  pingroute:
    plugin: flutter
    source: .
    flutter-target: lib/main.dart
    build-packages:
      - clang
      - cmake
      - ninja-build
      - pkg-config
      - libgtk-3-dev
      - liblzma-dev
